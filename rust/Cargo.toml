[workspace]
resolver = "2"
members = [
  "crates/kaneo-agent",
  "crates/kaneo-api",
  "crates/kaneo-core",
  "crates/kaneo-desktop",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
aes-gcm = "0.10"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2.11", default-features = false, features = ["wry", "x11"] }
tauri-build = "2.6"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = "0.7"
tower-http = { version = "0.6", features = ["fs"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }
